version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies, no-changelog]
    commit-message:
      prefix: build(deps)
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
      rust-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/ui
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies, no-changelog]
    commit-message:
      prefix: build(deps)
    groups:
      tauri-js:
        patterns: ["@tauri-apps/*"]
      ui-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: [dependencies, no-changelog]
    commit-message:
      prefix: build(ci)
    groups:
      actions:
        patterns: ["*"]

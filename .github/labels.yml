# Kind
- name: "bug"
  color: "#d73a4a"
  description: "Something in Vestigium does not work as it should"
- name: "enhancement"
  color: "#a2eeef"
  description: "A new feature, or an improvement to an existing one"
- name: "documentation"
  color: "#0075ca"
  description: "README, wiki or other written documentation"
- name: "diagnosis"
  color: "#d93f0b"
  description: "A report names the wrong cause or none, or is unclear"
- name: "question"
  color: "#d876e3"
  description: "A question about using Vestigium"

# Topic
- name: "accessibility"
  color: "#f143ab"
  description: "Barrier affecting people with disabilities"
- name: "translation"
  color: "#0e8a16"
  description: "Wrong, missing or unclear text in a language"
- name: "dependencies"
  color: "#0366d6"
  description: "Update to a dependency or a GitHub Action"

# Status
- name: "status: needs-triage"
  color: "#fbca04"
  description: "Not yet read by a maintainer"
- name: "status: needs-info"
  color: "#fef2c0"
  description: "Waiting for an answer from the reporter"

# Resolution
- name: "duplicate"
  color: "#cfd3d7"
  description: "This issue or pull request already exists"
- name: "invalid"
  color: "#e4e669"
  description: "This does not seem right"
- name: "wontfix"
  color: "#ffffff"
  description: "This will not be worked on"

# Community
- name: "good first issue"
  color: "#7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "#008672"
  description: "Extra attention is needed"

# Process
- name: "no-changelog"
  color: "#ededed"
  description: "Internal change with no visible effect; skips the changelog check"

# Area, one per commit scope
- name: "area: core"
  color: "#bfd4f2"
  description: "Detection and diagnosis logic shared by every part"
- name: "area: collect"
  color: "#bfd4f2"
  description: "Reading Windows data: counters, events, dumps and tests"
- name: "area: store"
  color: "#bfd4f2"
  description: "The local history database"
- name: "area: ipc"
  color: "#bfd4f2"
  description: "The channel between the monitor and the window"
- name: "area: agent"
  color: "#bfd4f2"
  description: "The background monitor and its tray icon"
- name: "area: helper"
  color: "#bfd4f2"
  description: "The elevated helper that runs administrator tasks"
- name: "area: ui"
  color: "#bfd4f2"
  description: "The window: screens, charts and styling"
- name: "area: ci"
  color: "#bfd4f2"
  description: "Workflows and build tooling"
- name: "area: installer"
  color: "#bfd4f2"
  description: "The installer, the updater and the update feed"
- name: "area: i18n"
  color: "#bfd4f2"
  description: "Texts and translations"

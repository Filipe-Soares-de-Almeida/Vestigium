name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

jobs:
  check:
    name: Format, lint, test and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install front-end dependencies
        run: npm ci --prefix apps/ui

      - name: Type-check the front end
        run: npm run check --prefix apps/ui

      - name: Test the front end
        run: npm test --prefix apps/ui

      - name: Build the front end
        run: npm run build --prefix apps/ui

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Check the third-party list against the dependencies
        run: cargo run --locked -p vestigium-notices -- --check

      - name: Test the event subscription against the real event log
        run: cargo test -p vestigium-collect --test events --locked -- --ignored

      - name: Build release
        run: cargo build --workspace --release --locked

name: Release

# A v* tag on main builds a draft release to check and publish by hand. Run by hand, it builds and signs
# the installer and keeps it as a workflow artifact, publishing nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, sign and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check that the tag is on main
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "The tag $env:GITHUB_REF_NAME does not point at a commit on main." }
          "VERSION=$($env:GITHUB_REF_NAME.TrimStart('v'))" >> $env:GITHUB_ENV

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Build and sign the installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ./tools/bundle.ps1
          if (-not (Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe.sig')) { throw "The installer was not signed." }

      - name: Keep the signed installer
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: target/release/bundle/nsis/*-setup.exe*

      - name: Write the release notes and the update feed
        if: github.event_name == 'push'
        shell: pwsh
        run: ./tools/release.ps1 -Version $env:VERSION -Out release

      - name: Write the checksums
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $setup = "target/release/bundle/nsis/Vestigium_$($env:VERSION)_x64-setup.exe"
          $lines = foreach ($file in @($setup, "$setup.sig", 'release/latest.json')) {
              "$((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant())  $(Split-Path $file -Leaf)"
          }
          [System.IO.File]::WriteAllText("$PWD/release/SHA256SUMS.txt", ($lines -join "`n") + "`n")

      - name: Attest where the installer was built
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/release/bundle/nsis/*-setup.exe

      - name: Draft the release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "target/release/bundle/nsis/Vestigium_$($env:VERSION)_x64-setup.exe"
          gh release create $env:GITHUB_REF_NAME $setup "$setup.sig" release/latest.json release/SHA256SUMS.txt `
            --title "Vestigium $env:VERSION" --notes-file release/release-notes.md --verify-tag --draft

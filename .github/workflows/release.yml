name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check that the tag is on main
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "The tag $env:GITHUB_REF_NAME does not point at a commit on main." }
          "VERSION=$($env:GITHUB_REF_NAME.TrimStart('v'))" >> $env:GITHUB_ENV

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Build and sign the installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./tools/bundle.ps1

      - name: Write the release notes and the update feed
        shell: pwsh
        run: ./tools/release.ps1 -Version $env:VERSION -Out release

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "target/release/bundle/nsis/Vestigium_$($env:VERSION)_x64-setup.exe"
          gh release create $env:GITHUB_REF_NAME $setup "$setup.sig" release/latest.json `
            --title "Vestigium $env:VERSION" --notes-file release/release-notes.md --verify-tag

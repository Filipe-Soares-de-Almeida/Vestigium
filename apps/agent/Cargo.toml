[package]
name = "argos-agent"
description = "Background watcher of Argos."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argos-collect = { workspace = true }
argos-core = { workspace = true }
argos-i18n = { workspace = true }
argos-ipc = { workspace = true }
argos-store = { workspace = true }
tray-icon = { workspace = true }

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

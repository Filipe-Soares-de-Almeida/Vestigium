[package]
name = "vestigium-agent"
description = "Background watcher of Vestigium."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "Vestigium"
path = "src/main.rs"

[build-dependencies]
winresource = { workspace = true }

[dependencies]
vestigium-brand = { workspace = true }
vestigium-collect = { workspace = true }
vestigium-core = { workspace = true }
vestigium-i18n = { workspace = true }
vestigium-ipc = { workspace = true }
vestigium-store = { workspace = true }
tray-icon = { workspace = true }

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
